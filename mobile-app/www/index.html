<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Onyx Workout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #08090a;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1f2937, #111827);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    p {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 28px;
      max-width: 320px;
      line-height: 1.5;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.1);
      padding: 8px 16px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(96, 165, 250, 0.3);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active {
      background: #1d4ed8;
    }
    .secondary-btn {
      background: #1f2937;
      color: #d1d5db;
    }
    .secondary-btn:active {
      background: #374151;
    }
    .server-input-container {
      display: none;
      margin-top: 16px;
      width: 100%;
      max-width: 300px;
    }
    input {
      width: 100%;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 12px 14px;
      color: white;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="logo">🏋️</div>
  <h1>Onyx Workout</h1>
  <p>Connessione al server in corso...</p>

  <div class="status" id="statusBox">
    <div class="spinner"></div>
    <span>Connessione a Tailscale / Nginx...</span>
  </div>

  <div class="actions">
    <button onclick="connectNow()">Riprova Connessione</button>
    <button class="secondary-btn" onclick="toggleCustomUrl()">Impostazioni Server</button>
  </div>

  <div class="server-input-container" id="customUrlBox">
    <input type="url" id="serverUrl" placeholder="https://onyx.francescoadreani.dev" />
    <button onclick="saveAndConnect()">Salva & Connetti</button>
  </div>

  <script>
    const DEFAULT_URL = 'https://onyx.francescoadreani.dev';
    // Clear any obsolete legacy tailscale URL and enforce official domain
    localStorage.removeItem('onyx_server_url');
    let targetUrl = DEFAULT_URL;
    document.getElementById('serverUrl').value = targetUrl;

    function connectNow() {
      window.location.href = targetUrl;
    }

    function toggleCustomUrl() {
      const box = document.getElementById('customUrlBox');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function saveAndConnect() {
      const val = document.getElementById('serverUrl').value.trim();
      if (val) {
        targetUrl = val.startsWith('http') ? val : 'https://' + val;
        localStorage.setItem('onyx_server_url', targetUrl);
        connectNow();
      }
    }

    // Auto connect immediately to onyx.francescoadreani.dev
    setTimeout(connectNow, 300);
  </script>
</body>
</html>
