apply plugin: 'com.android.application'

android {
    namespace = "com.onyx.workoutapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.onyx.workoutapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (!keystorePropsFile.exists()) {
                keystorePropsFile = file('keystore.properties')
            }
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                keystorePropsFile.withInputStream { stream -> props.load(stream) }
                def storeFilePath = props['storeFile']
                if (storeFilePath) {
                    def storeFileObj = rootProject.file(storeFilePath)
                    if (!storeFileObj.exists()) {
                        storeFileObj = file(storeFilePath)
                    }
                    storeFile storeFileObj
                }
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (!keystorePropsFile.exists()) {
                keystorePropsFile = file('keystore.properties')
            }
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleasePackagingRequested = taskGraph.allTasks.any { task ->
        task.name in ['packageRelease', 'packageReleaseBundle', 'assembleRelease', 'bundleRelease']
    }
    if (isReleasePackagingRequested) {
        def keystorePropsFile = rootProject.file('keystore.properties')
        if (!keystorePropsFile.exists()) {
            keystorePropsFile = file('keystore.properties')
        }
        if (!keystorePropsFile.exists()) {
            throw new GradleException(
                "\n================================================================================\n" +
                "[ERRORE FIRMA RELEASE ONYX]\n" +
                "Impossibile compilare la release: 'keystore.properties' non trovato!\n\n" +
                "Per produrre una release firmata (APK/AAB):\n" +
                "1. Genera il keystore con keytool (se non lo hai gia' fatto):\n" +
                "   keytool -genkeypair -v -keystore onyx-release-key.jks -alias onyx-release-key -keyalg RSA -keysize 2048 -validity 10000\n" +
                "2. Copia 'mobile-app/android/keystore.properties.example' in 'mobile-app/android/keystore.properties'\n" +
                "3. Inserisci in 'keystore.properties' il percorso del file keystore (.jks) e le password scelte.\n" +
                "Dettagli completi in: ISLAND_REMEDIATION_REPORT.md (Sezione 4)\n" +
                "================================================================================\n"
            )
        }
        def props = new Properties()
        keystorePropsFile.withInputStream { stream -> props.load(stream) }
        def storePath = props['storeFile']
        if (!storePath) {
            throw new GradleException(
                "\n[ERRORE FIRMA RELEASE ONYX] Il campo 'storeFile' e' mancante o vuoto in: ${keystorePropsFile.absolutePath}\n"
            )
        }
        def keyFile = rootProject.file(storePath)
        if (!keyFile.exists()) {
            keyFile = file(storePath)
        }
        if (!keyFile.exists()) {
            throw new GradleException(
                "\n================================================================================\n" +
                "[ERRORE FIRMA RELEASE ONYX]\n" +
                "Il file keystore specificato in 'storeFile' non esiste!\n" +
                "Percorso cercato: ${keyFile.absolutePath}\n" +
                "Verifica il percorso in ${keystorePropsFile.absolutePath} o genera il keystore.\n" +
                "================================================================================\n"
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:1.7.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
