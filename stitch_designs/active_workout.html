<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Active Workout Session - Performance Mode</title>

                "tertiary-container": "#e4e2e1",
                "surface-container": "#201f1f",
                "on-primary-fixed": "#171e00",
                "inverse-primary": "#536600",
                "surface-variant": "#353534",
                "surface-container-high": "#2a2a2a",

                "on-secondary": "#2f3131",
                "primary-container": "#caf300",
                "on-primary": "#2a3400",
                "inverse-on-surface": "#313030",
                "surface-tint": "#b0d500",
                "on-tertiary-fixed": "#1b1c1c",
                "on-surface": "#e5e2e1",
                "primary-fixed": "#caf300",
                "on-secondary-container": "#b4b5b5",
                "primary": "#ffffff",
                "surface-dim": "#131313",
                "error-container": "#93000a",
                "surface-container-highest": "#353534",
                "surface-bright": "#3a3939",
                "tertiary": "#ffffff",
                "on-tertiary-fixed-variant": "#474746",
                "inverse-surface": "#e5e2e1",
                "on-secondary-fixed": "#1a1c1c",
                "secondary": "#c6c6c7",
                "secondary-fixed": "#e2e2e2",
                "secondary-container": "#454747",
                "background": "#131313",
                "tertiary-fixed-dim": "#c8c6c5",
                "primary-fixed-dim": "#b0d500"
        },
        "borderRadius": {
                "DEFAULT": "1rem",
                "lg": "2rem",
                "xl": "3rem",
                "full": "9999px"
        },
        "spacing": {
                "stack-lg": "2rem",
                "section-gap": "4rem",
                "stack-xs": "0.25rem",
                "grid-margin": "2rem",
                "stack-sm": "0.5rem",
                "grid-gutter": "1rem",
                "stack-md": "1rem"
        },
        "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="bg-[#0a0a0a] text-on-background min-h-screen flex flex-col font-body-md overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Active Workout Canvas -->
<main class="flex-grow flex flex-col items-center justify-between w-full relative z-10 h-full">
<!-- Top Progress Bar & Workout Name -->
<div class="w-full flex flex-col pt-14 px-6 pb-4">
<div class="w-full h-1 bg-[#262626] rounded-full overflow-hidden mb-4">
<div class="h-full bg-primary-fixed shadow-[0_0_10px_rgba(202,243,0,0.8)] transition-all duration-1000 ease-linear w-1/3"></div>
</div>
<div class="w-full text-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Heavy Lower Body Focus</span>
</div>
</div>
<!-- Timer / Rep Counter Core -->
<div class="flex flex-col items-center justify-center flex-grow w-full px-6">
<div class="font-display text-[120px] sm:text-[140px] md:text-[200px] leading-none text-primary font-black tracking-tighter tabular-nums mb-8 w-full text-center">
            00:45
        </div>
<!-- Exercise Info -->
<div class="flex flex-col items-center text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight mb-2">Barbell Squats</h2>
<span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-widest mb-6">Set 2 of 4</span>
<div class="flex gap-4">
<div class="px-6 py-3 rounded-[32px] bg-surface-container border border-[#333333] flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="weight">weight</span>
<span class="font-label-caps text-label-caps text-primary">225 LBS</span>
</div>
<div class="px-6 py-3 rounded-[32px] bg-surface-container border border-[#333333] flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="repeat">repeat</span>
<span class="font-label-caps text-label-caps text-primary">8 REPS</span>
</div>
</div>
</div>
</div>
<!-- Controls -->
<div class="w-full flex justify-center items-center pb-16 pt-8 gap-8 px-6 mt-auto">
<button aria-label="Previous Exercise" class="w-16 h-16 rounded-full bg-[#1A1A1A] border border-[#333333] flex items-center justify-center text-primary hover:bg-[#262626] transition-colors shrink-0">
<span class="material-symbols-outlined text-3xl" data-icon="skip_previous">skip_previous</span>
</button>
<button aria-label="Play/Pause" class="w-28 h-28 rounded-[2rem] bg-primary-container text-on-primary-container flex items-center justify-center hover:scale-105 transition-transform hover:bg-primary-fixed-dim shadow-[0_0_30px_rgba(202,243,0,0.2)] shrink-0">
<span class="material-symbols-outlined text-5xl" data-icon="pause" data-weight="fill">pause</span>
</button>
<button aria-label="Next Exercise" class="w-16 h-16 rounded-full bg-[#1A1A1A] border border-[#333333] flex items-center justify-center text-primary hover:bg-[#262626] transition-colors shrink-0">
<span class="material-symbols-outlined text-3xl" data-icon="skip_next">skip_next</span>
</button>
</div>
</main>
</body></html>
