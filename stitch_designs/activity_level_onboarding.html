<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
    <title>Gofit - Onboarding Activity Level</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#131313",
              "surface": "#161616",
              "surface-container": "#201f1f",
              "surface-container-low": "#1c1b1b",
              "surface-container-high": "#2a2a2a",
              "primary": "#ffffff",
              "primary-fixed": "#caf300",
              "on-surface-variant": "#c5c9ac",
              "error": "#ffb4ab"
            },
            borderRadius: {
              "DEFAULT": "1rem",
              "lg": "2rem",
              "xl": "3rem"
            }
          }
        }
      }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131313;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-[#e5e2e1] min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#161616] border border-[#262626] rounded-[32px] overflow-hidden flex flex-col h-[750px] shadow-2xl relative">
        <!-- Top App Bar -->
        <header class="flex items-center justify-between px-6 pt-6 w-full shrink-0">
            <button class="text-primary hover:bg-[#201f1f] w-10 h-10 rounded-full flex items-center justify-center transition-colors">
                <span class="material-symbols-outlined text-2xl">arrow_back</span>
            </button>
            <span class="text-xs font-black uppercase tracking-widest text-on-surface-variant">Step 3 of 4</span>
            <div class="w-10"></div>
        </header>

        <!-- Progress Indicator -->
        <div class="px-6 pt-4 shrink-0">
            <div class="w-full flex gap-1.5 h-1">
                <div class="flex-1 bg-[#caf300] rounded-full"></div>
                <div class="flex-1 bg-[#caf300] rounded-full"></div>
                <div class="flex-1 bg-[#caf300] rounded-full"></div>
                <div class="flex-1 bg-[#262626] rounded-full"></div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1 px-6 pt-10 flex flex-col items-center select-none overflow-y-auto no-scrollbar">
            <div class="text-center mb-8 w-full">
                <h1 class="text-[32px] font-black uppercase tracking-tight text-white mb-2">Physical Activity Level</h1>
                <p class="text-sm font-medium text-on-surface-variant max-w-[280px] mx-auto">How often do you train? Choose your regular activity level.</p>
            </div>

            <!-- Options Stack -->
            <div class="flex flex-col gap-4 w-full my-auto">
                <!-- Option 1: Beginner -->
                <label class="activity-card relative flex items-center justify-between p-5 bg-[#1c1b1b] border border-[#262626] rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition-all duration-200">
                    <input class="sr-only" name="activity_level" type="radio" value="beginner"/>
                    <div class="flex flex-col">
                        <span class="text-lg font-bold text-white uppercase tracking-tight">Beginner</span>
                        <span class="text-xs font-semibold text-on-surface-variant uppercase mt-1 tracking-wider">1-2 times/week</span>
                    </div>
                    <div class="check-indicator w-6 h-6 rounded-full border border-neutral-600 flex items-center justify-center transition-all">
                        <span class="material-symbols-outlined text-xs text-[#131313] opacity-0 select-none">check</span>
                    </div>
                </label>

                <!-- Option 2: Intermediate -->
                <label class="activity-card relative flex items-center justify-between p-5 bg-[#1c1b1b] border border-[#262626] rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition-all duration-200">
                    <input checked class="sr-only" name="activity_level" type="radio" value="intermediate"/>
                    <div class="flex flex-col">
                        <span class="text-lg font-bold text-white uppercase tracking-tight">Intermediate</span>
                        <span class="text-xs font-semibold text-on-surface-variant uppercase mt-1 tracking-wider">3-4 times/week</span>
                    </div>
                    <div class="check-indicator w-6 h-6 rounded-full border border-neutral-600 flex items-center justify-center transition-all">
                        <span class="material-symbols-outlined text-xs text-[#131313] opacity-0 select-none">check</span>
                    </div>
                </label>

                <!-- Option 3: Advanced -->
                <label class="activity-card relative flex items-center justify-between p-5 bg-[#1c1b1b] border border-[#262626] rounded-2xl cursor-pointer hover:bg-[#2a2a2a] transition-all duration-200">
                    <input class="sr-only" name="activity_level" type="radio" value="advanced"/>
                    <div class="flex flex-col">
                        <span class="text-lg font-bold text-white uppercase tracking-tight">Advanced</span>
                        <span class="text-xs font-semibold text-on-surface-variant uppercase mt-1 tracking-wider">5+ times/week</span>
                    </div>
                    <div class="check-indicator w-6 h-6 rounded-full border border-neutral-600 flex items-center justify-center transition-all">
                        <span class="material-symbols-outlined text-xs text-[#131313] opacity-0 select-none">check</span>
                    </div>
                </label>
            </div>
        </main>

        <!-- Footer -->
        <footer class="p-6 bg-[#161616] border-t border-[#262626] flex flex-col gap-3 shrink-0">
            <button class="w-full bg-[#caf300] hover:bg-[#b0d500] active:scale-[0.98] text-[#131313] font-bold py-4 rounded-full transition-all flex items-center justify-center gap-2">
                <span>Continue</span>
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
            </button>
            <button class="w-full bg-transparent hover:bg-[#201f1f] text-white border border-[#262626] font-bold py-3.5 rounded-full transition-all">
                Back
            </button>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.activity-card');

            const updateCards = () => {
                cards.forEach(card => {
                    const input = card.querySelector('input');
                    const indicator = card.querySelector('.check-indicator');
                    const checkIcon = card.querySelector('.material-symbols-outlined');

                    if (input.checked) {
                        card.classList.remove('border-[#262626]', 'bg-[#1c1b1b]');
                        card.classList.add('border-[#caf300]', 'bg-[#201f1f]');
                        
                        indicator.classList.remove('border-neutral-600');
                        indicator.classList.add('border-[#caf300]', 'bg-[#caf300]');
                        
                        checkIcon.classList.remove('opacity-0');
                        checkIcon.classList.add('opacity-100');
                    } else {
                        card.classList.add('border-[#262626]', 'bg-[#1c1b1b]');
                        card.classList.remove('border-[#caf300]', 'bg-[#201f1f]');
                        
                        indicator.classList.add('border-neutral-600');
                        indicator.classList.remove('border-[#caf300]', 'bg-[#caf300]');
                        
                        checkIcon.classList.add('opacity-0');
                        checkIcon.classList.remove('opacity-100');
                    }
                });
            };

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    card.querySelector('input').checked = true;
                    updateCards();
                });
            });

            // Run initial update
            updateCards();
        });
    </script>
</body>
</html>
