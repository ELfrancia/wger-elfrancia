version: '3.8'

services:
  web:
    build: .
    container_name: workout_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DJANGO_SETTINGS_MODULE=settings.local_dev
      - PYTHONUNBUFFERED=1
      - DJANGO_DB_DATABASE=/app/database.sqlite
    entrypoint: ["sh", "/app/docker-entrypoint.sh"]
    command: gunicorn wger.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2

