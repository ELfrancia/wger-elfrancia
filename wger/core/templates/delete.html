{% load i18n crispy_forms_tags %}

<div class="space-y-4 text-white">
    {% if title %}
        <h3 class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
            <span class="material-symbols-outlined text-red-400">warning</span>
            {{ title }}
        </h3>
    {% endif %}
    
    <div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-200 text-sm">
        <p class="font-semibold">{% translate "Are you sure you want to delete this? This action cannot be undone." %}</p>
        {% if delete_message %}
            <p class="mt-1 opacity-90">{{ delete_message }}</p>
        {% endif %}
    </div>

    <div class="wger-legacy-form">
        {% crispy form %}
    </div>
</div>
