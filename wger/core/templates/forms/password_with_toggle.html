<!-- templates/forms/password_with_toggle.html -->
<div class="password-wrapper" style="position: relative; display: block;">
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% if widget.value %} value="{{ widget.value }}"{% endif %}{% if widget.attrs.id %} id="{{ widget.attrs.id }}"{% endif %}{% if widget.attrs.class %} class="{{ widget.attrs.class }}"{% endif %}{% if widget.attrs.placeholder %} placeholder="{{ widget.attrs.placeholder }}"{% endif %}{% if widget.attrs.required %} required{% endif %}{% if widget.attrs.maxlength %} maxlength="{{ widget.attrs.maxlength }}"{% endif %}{% if widget.attrs.autocomplete %} autocomplete="{{ widget.attrs.autocomplete }}"{% endif %} style="width: 100%; padding-right: 40px;">
    <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 5px; z-index: 10;">
         <i class="fas fa-eye-slash eye-closed p-2" style="color: #245daf;"></i>
         <i class="fas fa-eye eye-open p-2" style="color: #245daf; display: none;"></i>
    </button>
</div>

{% if widget.attrs.id %}
<div class="password-checklist-card card mt-3 shadow-sm border-0 d-none" id="checklist_{{ widget.attrs.id }}">
    <div class="card-body p-3">
        <h6 class="card-title mb-2 text-primary font-weight-bold d-flex align-items-center" style="font-size: 0.95rem;">
            <i class="fas fa-shield-alt mr-2"></i> Password Requirements
        </h6>
        <div class="progress mb-3" style="height: 6px; border-radius: 3px; background-color: #e2e8f0;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-danger" role="progressbar" style="width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <ul class="list-unstyled mb-0 requirement-list" style="margin-left: 0; padding-left: 0;">
            <li class="requirement-item py-1 d-flex align-items-center text-muted" data-rule="length">
                <span class="icon-container mr-2 d-inline-flex align-items-center justify-content-center" style="width: 20px;">
                    <i class="far fa-circle text-muted"></i>
                </span>
                <span class="requirement-text">Length of at least 8 characters</span>
            </li>
            <li class="requirement-item py-1 d-flex align-items-center text-muted" data-rule="uppercase">
                <span class="icon-container mr-2 d-inline-flex align-items-center justify-content-center" style="width: 20px;">
                    <i class="far fa-circle text-muted"></i>
                </span>
                <span class="requirement-text">At least one uppercase letter</span>
            </li>
            <li class="requirement-item py-1 d-flex align-items-center text-muted" data-rule="lowercase">
                <span class="icon-container mr-2 d-inline-flex align-items-center justify-content-center" style="width: 20px;">
                    <i class="far fa-circle text-muted"></i>
                </span>
                <span class="requirement-text">At least one lowercase letter</span>
            </li>
            <li class="requirement-item py-1 d-flex align-items-center text-muted" data-rule="symbol">
                <span class="icon-container mr-2 d-inline-flex align-items-center justify-content-center" style="width: 20px;">
                    <i class="far fa-circle text-muted"></i>
                </span>
                <span class="requirement-text">At least one symbol (e.g. !@#$%)</span>
            </li>
            <li class="requirement-item py-1 d-flex align-items-center text-muted" data-rule="non-numeric">
                <span class="icon-container mr-2 d-inline-flex align-items-center justify-content-center" style="width: 20px;">
                    <i class="far fa-circle text-muted"></i>
                </span>
                <span class="requirement-text">Not entirely numeric</span>
            </li>
            <li class="requirement-item py-1 d-flex align-items-center text-muted" data-rule="personal-info">
                <span class="icon-container mr-2 d-inline-flex align-items-center justify-content-center" style="width: 20px;">
                    <i class="far fa-circle text-muted"></i>
                </span>
                <span class="requirement-text">Not too similar to personal info</span>
            </li>
        </ul>
    </div>
</div>
{% endif %}

<script>
(function() {
    // Escaped Django context variables for personal info
    const requestUser = {
        username: '{{ request.user.username|escapejs }}',
        email: '{{ request.user.email|escapejs }}',
        firstName: '{{ request.user.first_name|escapejs }}',
        lastName: '{{ request.user.last_name|escapejs }}'
    };

    function calculateSimilarity(s1, s2) {
        if (!s1 || !s2) return 0;
        s1 = s1.toLowerCase();
        s2 = s2.toLowerCase();
        const len1 = s1.length;
        const len2 = s2.length;
        const dp = Array(len1 + 1).fill(null).map(() => Array(len2 + 1).fill(0));
        
        for (let i = 1; i <= len1; i++) {
            for (let j = 1; j <= len2; j++) {
                if (s1[i - 1] === s2[j - 1]) {
                    dp[i][j] = dp[i - 1][j - 1] + 1;
                } else {
                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }
        }
        return (2.0 * dp[len1][len2]) / (len1 + len2);
    }

    function isTooSimilar(password, info) {
        if (!password) return false;
        const threshold = 0.7;
        const pwd = password.toLowerCase();
        
        const parts = new Set();
        for (const key in info) {
            const val = info[key];
            if (val && typeof val === 'string') {
                const lowerVal = val.toLowerCase().trim();
                if (lowerVal.length > 0) {
                    parts.add(lowerVal);
                    const splitParts = lowerVal.split(/[^a-zA-Z0-9]+/);
                    for (const part of splitParts) {
                        if (part.length >= 3) {
                            parts.add(part);
                        }
                    }
                }
            }
        }
        
        for (const part of parts) {
            if (pwd.includes(part) && part.length / pwd.length >= threshold) {
                return true;
            }
            if (part.includes(pwd) && pwd.length / part.length >= threshold) {
                return true;
            }
            if (calculateSimilarity(pwd, part) >= threshold) {
                return true;
            }
        }
        return false;
    }

    function getPersonalInfo() {
        const info = {
            username: requestUser.username || '',
            email: requestUser.email || '',
            firstName: requestUser.firstName || '',
            lastName: requestUser.lastName || ''
        };
        
        const usernameInput = document.querySelector('#id_username') || document.querySelector('input[name="username"]');
        const emailInput = document.querySelector('#id_email') || document.querySelector('input[name="email"]');
        const firstNameInput = document.querySelector('#id_first_name') || document.querySelector('input[name="first_name"]');
        const lastNameInput = document.querySelector('#id_last_name') || document.querySelector('input[name="last_name"]');
        
        if (usernameInput && usernameInput.value) info.username = usernameInput.value;
        if (emailInput && emailInput.value) info.email = emailInput.value;
        if (firstNameInput && firstNameInput.value) info.firstName = firstNameInput.value;
        if (lastNameInput && lastNameInput.value) info.lastName = lastNameInput.value;
        
        return info;
    }

    function initPasswordToggle() {
        const passwordWrappers = document.querySelectorAll('.password-wrapper');

        passwordWrappers.forEach(function(wrapper) {
            if (wrapper.hasAttribute('data-toggle-initialized')) {
                return;
            }

            const passwordInput = wrapper.querySelector('input');
            const toggleBtn = wrapper.querySelector('.password-toggle-btn');
            const eyeOpen = wrapper.querySelector('.eye-open');
            const eyeClosed = wrapper.querySelector('.eye-closed');

            if (toggleBtn && passwordInput && eyeOpen && eyeClosed) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        eyeOpen.style.display = 'none';
                        eyeClosed.style.display = 'block';
                    } else {
                        passwordInput.type = 'password';
                        eyeOpen.style.display = 'block';
                        eyeClosed.style.display = 'none';
                    }
                });

                wrapper.setAttribute('data-toggle-initialized', 'true');
            }
        });
    }

    function initPasswordValidation() {
        const passwordInputs = document.querySelectorAll('.password-wrapper input');
        
        passwordInputs.forEach(function(inputField) {
            if (inputField.hasAttribute('data-checklist-initialized')) {
                return;
            }
            
            const hintId = 'hint_id_' + inputField.id;
            const hintContainer = document.getElementById(hintId);
            const checklistCard = document.getElementById('checklist_' + inputField.id);
            
            if (hintContainer && checklistCard) {
                // Hide default hint container/list
                hintContainer.style.display = 'none';
                
                // Show checklist card
                checklistCard.classList.remove('d-none');
                
                const requirementItems = checklistCard.querySelectorAll('.requirement-item');
                const progressBar = checklistCard.querySelector('.progress-bar');
                
                function validatePassword() {
                    const val = inputField.value;
                    const isEmpty = val.length === 0;
                    
                    const rules = {
                        length: val.length >= 8,
                        uppercase: /[A-Z]/.test(val),
                        lowercase: /[a-z]/.test(val),
                        symbol: /[^A-Za-z0-9]/.test(val),
                        'non-numeric': !/^\d+$/.test(val),
                        'personal-info': !isTooSimilar(val, getPersonalInfo())
                    };
                    
                    let satisfiedCount = 0;
                    
                    requirementItems.forEach(item => {
                        const ruleName = item.getAttribute('data-rule');
                        const isSatisfied = rules[ruleName];
                        const iconContainer = item.querySelector('.icon-container');
                        
                        if (isEmpty) {
                            item.className = 'requirement-item py-1 d-flex align-items-center text-muted empty';
                            iconContainer.innerHTML = '<i class="far fa-circle text-muted"></i>';
                        } else if (isSatisfied) {
                            if (!item.classList.contains('met')) {
                                item.className = 'requirement-item py-1 d-flex align-items-center text-success met';
                                iconContainer.innerHTML = '<i class="fas fa-check-circle text-success icon-pop"></i>';
                            }
                            satisfiedCount++;
                        } else {
                            if (!item.classList.contains('unmet')) {
                                item.className = 'requirement-item py-1 d-flex align-items-center text-danger unmet';
                                iconContainer.innerHTML = '<i class="fas fa-times-circle text-danger icon-shake"></i>';
                            }
                        }
                    });
                    
                    // Update progress bar
                    const percent = Math.round((satisfiedCount / Object.keys(rules).length) * 100);
                    progressBar.style.width = percent + '%';
                    progressBar.setAttribute('aria-valuenow', percent);
                    
                    // Progress bar color based on strength
                    progressBar.className = 'progress-bar progress-bar-striped progress-bar-animated';
                    if (percent <= 33) {
                        progressBar.classList.add('bg-danger');
                    } else if (percent <= 66) {
                        progressBar.classList.add('bg-warning');
                    } else if (percent < 100) {
                        progressBar.classList.add('bg-info');
                    } else {
                        progressBar.classList.add('bg-success');
                    }
                }
                
                inputField.addEventListener('input', validatePassword);
                validatePassword();
                
                inputField.setAttribute('data-checklist-initialized', 'true');
            }
        });
    }

    // Initialize all functions
    function initAll() {
        initPasswordToggle();
        initPasswordValidation();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAll);
    } else {
        initAll();
    }

    // Late rendering fallbacks
    setTimeout(initAll, 100);
    setTimeout(initAll, 500);
})();
</script>

<style>
.password-wrapper {
    position: relative;
    display: block;
}

.password-wrapper input {
    padding-right: 40px !important;
    box-sizing: border-box;
}

.password-toggle-btn {
    color: #6c757d;
}

.password-toggle-btn:hover {
    color: #495057;
}

.password-toggle-btn:focus {
    outline: 2px solid #007bff;
    outline-offset: 2px;
}

/* Premium checklist styles */
.password-checklist-card {
    border-radius: 12px !important;
    background: var(--card-bg, rgba(255, 255, 255, 0.85)) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border-color, rgba(226, 232, 240, 0.8)) !important;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05) !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
}

/* Dark mode overrides */
[data-bs-theme="dark"] .password-checklist-card,
body.dark-mode .password-checklist-card,
.dark-mode .password-checklist-card {
    background: rgba(30, 41, 59, 0.85) !important;
    border-color: rgba(71, 85, 105, 0.5) !important;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25) !important;
}

.password-checklist-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08) !important;
    border-color: rgba(36, 93, 175, 0.45) !important;
}

[data-bs-theme="dark"] .password-checklist-card:hover,
body.dark-mode .password-checklist-card:hover,
.dark-mode .password-checklist-card:hover {
    border-color: rgba(99, 102, 241, 0.45) !important;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35) !important;
}

.requirement-item {
    transition: all 0.25s ease;
    font-size: 0.875rem;
    font-weight: 500;
}

.requirement-item.met {
    color: #2e7d32 !important;
    transform: translateX(4px);
}

[data-bs-theme="dark"] .requirement-item.met,
body.dark-mode .requirement-item.met,
.dark-mode .requirement-item.met {
    color: #4caf50 !important;
}

.requirement-item.unmet {
    color: #c62828 !important;
}

[data-bs-theme="dark"] .requirement-item.unmet,
body.dark-mode .requirement-item.unmet,
.dark-mode .requirement-item.unmet {
    color: #f44336 !important;
}

.requirement-item.empty {
    color: #64748b !important;
}

[data-bs-theme="dark"] .requirement-item.empty,
body.dark-mode .requirement-item.empty,
.dark-mode .requirement-item.empty {
    color: #94a3b8 !important;
}

/* Animations for icons */
@keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-2px); }
    40%, 80% { transform: translateX(2px); }
}

.icon-pop {
    animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    display: inline-block;
}

.icon-shake {
    animation: shake 0.35s ease-in-out;
    display: inline-block;
}
</style>
